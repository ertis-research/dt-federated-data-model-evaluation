zero:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 32210
  nodeSelector:
    kubernetes.io/hostname: edge1
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

alpha:
  replicaCount: 1
  acl:
    enabled: false
  encryption:
    enabled: false
  configFile:
    config.yaml: |
      security:
        whitelist: 10.0.0.0/8,172.0.0.0/8,192.168.0.0/16
  service:
    type: NodePort
    nodePort: 32211
  persistentVolume:
    enabled: true
  nodeSelector:
    kubernetes.io/hostname: edge1
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

ratel:
  enabled: true
  service:
    type: NodePort
    nodePort: 32212
  nodeSelector:
    kubernetes.io/hostname: edge1