zero:
  service:
    type: NodePort
    nodePort: 32210
  nodeSelector:
    kubernetes.io/hostname: fog2
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

alpha:
  acl:
    enabled: false
  encryption:
    enabled: false
  configFile:
    config.yaml: |
      security:
        whitelist: 10.0.0.0/8,172.0.0.0/8,192.168.0.0/16
  service:
    type: NodePort
    nodePort: 32211
  persistentVolume:
    enabled: true
  nodeSelector:
    kubernetes.io/hostname: fog2
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

ratel:
  enabled: true
  service:
    type: NodePort
    nodePort: 32212
  nodeSelector:
    kubernetes.io/hostname: fog2