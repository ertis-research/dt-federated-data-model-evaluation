server:
  replicaCount: 1
  persistentVolume:
    enabled: false
  service:
    type: NodePort
    nodePort: 30090
  global:
    scrape_interval: 5s
    scrape_timeout: 5s
    evaluation_interval: 5s
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

prometheus-pushgateway:
  enabled: false

